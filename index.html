<!DOCTYPE html>
<html>
<head>
  <title>Catch the apple</title>
</head>
<body>
  <h1>Catch the apple</h1>
  <p>My own fun version of Catch the apple where i train ai to play and players compete along with it </p>
  <canvas id="game" width="400" height="500" style="background: skyblue;"></canvas>
  <button id="modeButton" onclick="toggleMode()">
  Switch to AI
</button>
<canvas id="network" width="480" height="500"
        style="background: #eeeeee;"></canvas>
<button onclick="testCurrentBrain()">Test current AI</button>
<p id="trainingStatus">Training has not started.</p>
<button onclick="trainOneGeneration()">
  Train one generation
</button>
<label>
  Load saved AI:
  <input type="file" accept=".json" onchange="loadBrainFile(this)">
</label>
<button onclick="testUnseenApples()">Test 100 new apples</button>

<button onclick="startChallenge()">Play 20 apples against AI</button>
<p id="challengeStatus">Load your saved AI before starting a challenge.</p>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let basketX = 160;
  let appleX=190;
  let appleY= 0;
  let score=0;
  let lives = 3;
  let moveLeft = false;
  let aiMode = false;
  let moveRight = false;

  let challengeDrops = null;
  let challengeIndex = 0;
  let challengeAIScore = 0;

  function drawNetwork(inputs, decision) {
  const network = document.getElementById("network");
  const pen = network.getContext("2d");
  pen.clearRect(0, 0, network.width, network.height);

  const layers = [inputs, decision.hidden, decision.outputs];
  const columns = [70, 230, 390];

  function nodeY(index, count) {
    return 100 + (index + 1) * 320 / (count + 1);
  }

  // Draw connections using the current brain's actual weights.
  for (let layer = 0; layer < 2; layer++) {
    const weights = layer === 0
      ? brain.hiddenWeights
      : brain.outputWeights;

    for (let target = 0; target < layers[layer + 1].length; target++) {
      for (let source = 0; source < layers[layer].length; source++) {
        const weight = weights[target][source];

        pen.strokeStyle = weight >= 0 ? "#26804a" : "#bb4455";
        pen.lineWidth = 0.5 + Math.min(3, Math.abs(weight));

        pen.beginPath();
        pen.moveTo(
          columns[layer],
          nodeY(source, layers[layer].length)
        );
        pen.lineTo(
          columns[layer + 1],
          nodeY(target, layers[layer + 1].length)
        );
        pen.stroke();
      }
    }
  }

  // Draw neurons using their actual activation values.
  for (let layer = 0; layer < layers.length; layer++) {
    for (let node = 0; node < layers[layer].length; node++) {
      const value = layers[layer][node];
      const y = nodeY(node, layers[layer].length);

      pen.fillStyle = value >= 0 ? "#26804a" : "#bb4455";
      pen.globalAlpha = 0.2 + Math.abs(value) * 0.8;
      pen.beginPath();
      pen.arc(columns[layer], y, 16, 0, Math.PI * 2);
      pen.fill();
      pen.globalAlpha = 1;

      pen.fillStyle = "black";
      pen.font = "12px Arial";
      pen.fillText(value.toFixed(2), columns[layer] - 15, y + 32);
    }
  }

  pen.fillStyle = "black";
  pen.font = "16px Arial";
  pen.fillText("Inputs", 45, 60);
  pen.fillText("Hidden", 205, 60);
  pen.fillText("Outputs", 360, 60);
  pen.fillText("Chosen action: " + decision.action, 130, 460);
} 
  function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "saddlebrown";
  ctx.fillRect(basketX,460, 80, 20);

  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(appleX, appleY, 10, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "black";
  ctx.font="20px Arial";
  ctx.fillText("Score: " + score, 15, 30);

  const counterLabel = challengeDrops !== null ? "Left: " : "Lives: ";
ctx.fillText(counterLabel + lives, 290, 30);
  const inputs = getInputs();
  const decision = runBrain(brain, inputs);
  drawNetwork(inputs, decision);

ctx.font = "12px Arial";
ctx.fillText(
  "Apple X: " + inputs[0].toFixed(2) +
  " | Apple Y: " + inputs[1].toFixed(2) +
  " | Basket X: " + inputs[2].toFixed(2),
  10, 50
);

ctx.font = "14px Arial";
ctx.fillText("AI suggests: " + decision.action, 10, 70);
ctx.font = "20px Arial";

  if(lives===0) {
    ctx.fillText("Game over! Press R to restart.", 60, 250);
  }
 }
document.addEventListener("keydown", function(event) {
  if (event.key.toLowerCase()==="r" && lives===0){
    challengeDrops = null;
document.getElementById("challengeStatus").textContent =
  "Practice mode.";
    basketX=160;
    score=0;
    lives=3;
    appleY=-10;
    appleX=10+Math.random()*(canvas.width-20);
    update();
    return;
  }
  
  if (lives===0){
    return;
  }
  
  if (event.key === "ArrowLeft") {
    event.preventDefault();
    moveLeft=true;
  }

  if (event.key === "ArrowRight") {
    event.preventDefault();
    moveRight=true;
  }
});
document.addEventListener("keyup",function(event){
  if (event.key==="ArrowLeft") moveLeft=false;
  if (event.key==="ArrowRight") moveRight=false;
});

window.addEventListener("blur", function() {
  moveLeft=false;
  moveRight=false;
})
function randomWeight() {
  return Math.random() * 2 - 1;
}

function createBrain() {
  return {
    hiddenWeights: Array.from(
      { length: 6 },
      () => Array.from({ length: 3 }, randomWeight)
    ),
    hiddenBiases: Array.from({ length: 6 }, randomWeight),

    outputWeights: Array.from(
      { length: 3 },
      () => Array.from({ length: 6 }, randomWeight)
    ),
    outputBiases: Array.from({ length: 3 }, randomWeight)
  };
}

let brain = createBrain();
let generation = 0;
const trainingDrops = Array.from(
  { length: 20},
  () => 10 + Math.random() * (canvas.width - 20)
);

function runBrain(model, inputs) {
  const hidden = model.hiddenWeights.map(function(weights, index) {
    let total = model.hiddenBiases[index];

    for (let i = 0; i < inputs.length; i++) {
      total = total + weights[i] * inputs[i];
    }

    return Math.tanh(total);
  });

  const outputs = model.outputWeights.map(function(weights, index) {
    let total = model.outputBiases[index];

    for (let i = 0; i < hidden.length; i++) {
      total = total + weights[i] * hidden[i];
    }

    return Math.tanh(total);
  });

  const bestIndex = outputs.indexOf(Math.max(...outputs));

  return {
    hidden: hidden,
    outputs: outputs,
    action: ["left", "stay", "right"][bestIndex]
  };
}

function getInputs() {
  return [
    appleX / canvas.width,
    Math.max(0,Math.min(1, appleY / canvas.height)),
    (basketX+40) / canvas.width
  ];
}
function moveBasket(action) {
  if (action==="left") basketX = basketX -4;
  if (action ==="right") basketX=basketX+4;

  basketX=Math.max(0,Math.min(canvas.width-80,basketX));
}

function evaluateBrain(model,drops) {
  let testBasketX = 160;
  let catches = 0;
  let fitness = 0;

  for (const dropX of drops) {
    let dropY = -10;
    let caught = false;

    while (dropY <= canvas.height + 10) {
      dropY=dropY +2;

      const inputs = [
        dropX / canvas.width,
        Math.max(0, Math.min(1, dropY / canvas.height)),
        (testBasketX + 40) / canvas.width
      ];

      const action = runBrain(model, inputs).action;

      if (action === "left") testBasketX -= 4;
      if (action === "right") testBasketX += 4;

      testBasketX = Math.max(
        0,
        Math.min(canvas.width - 80, testBasketX)
      );

      if (
        dropY + 10 >= 460 &&
        dropY - 10 <= 480 &&
        dropX + 10 >= testBasketX &&
        dropX - 10 <= testBasketX + 80
      ) {
        caught = true;
        break;
      }
    }

    if (caught) {
      catches +=1;
      fitness += 100;
    }

    const distance = Math.abs(dropX - (testBasketX + 40));
    fitness += 1- distance / canvas.width;
  }

  return { catches: catches, fitness: fitness };
}

function mutateBrain(parent) {
  function mutateValues(values) {
    return values.map(function(value) {
      if (Array.isArray(value)) {
        return mutateValues(value);
      }

      if (Math.random() < 0.2) {
        return value + randomWeight() * 0.3;
      }

      return value;
    });
  }

  return {
    hiddenWeights: mutateValues(parent.hiddenWeights),
    hiddenBiases: mutateValues(parent.hiddenBiases),
    outputWeights: mutateValues(parent.outputWeights),
    outputBiases: mutateValues(parent.outputBiases)
  };
}

function trainOneGeneration() {
  const before = evaluateBrain(brain, trainingDrops);
  let bestBrain = brain;
  let bestResult = before;

  for (let candidate = 0; candidate < 16; candidate++) {
    const child = candidate < 2
      ? createBrain()
      : mutateBrain(brain);

    const result = evaluateBrain(child, trainingDrops);

    if (result.fitness > bestResult.fitness) {
      bestBrain = child;
      bestResult = result;
    }
  }

  brain = bestBrain;
  generation += 1;

  document.getElementById("trainingStatus").textContent =
    "Generation " + generation +
    " | Before: " + before.catches +
    "/20 | Best: " + bestResult.catches + "/20";

  draw();
} 

async function loadBrainFile(input) {
  const file = input.files[0];
  if (!file) return;

  try {
    const saved = JSON.parse(await file.text());

    function validNumbers(values, count) {
      return Array.isArray(values) &&
        values.length === count &&
        values.every(Number.isFinite);
    }

    function validMatrix(matrix, rows, columns) {
      return Array.isArray(matrix) &&
        matrix.length === rows &&
        matrix.every(row => validNumbers(row, columns));
    }

    const model = saved.brain;

    if (
      !model ||
      !validMatrix(model.hiddenWeights, 6, 3) ||
      !validNumbers(model.hiddenBiases, 6) ||
      !validMatrix(model.outputWeights, 3, 6) ||
      !validNumbers(model.outputBiases, 3) ||
      !validNumbers(saved.trainingDrops, 20) ||
      !Number.isInteger(saved.generation) ||
      saved.generation < 0
    ) {
      throw new Error("This file does not match our network format.");
    }

    brain = model;
    generation = saved.generation;
    trainingDrops.splice(0, trainingDrops.length, ...saved.trainingDrops);

    const result = evaluateBrain(brain, trainingDrops);

    document.getElementById("trainingStatus").textContent =
      "Loaded generation " + generation +
      " | Training catches: " + result.catches + "/20";

    draw();
  } catch (error) {
    document.getElementById("trainingStatus").textContent =
      "Could not load AI: " + error.message;
  }

  input.value = "";
}

function testUnseenApples() {
  const unseenDrops = Array.from(
    { length: 100 },
    () => 10 + Math.random() * (canvas.width - 20)
  );

  const result = evaluateBrain(brain, unseenDrops);

  document.getElementById("trainingStatus").textContent =
    "Unseen test: caught " + result.catches + " of 100 apples.";
}

function testCurrentBrain() {
  const result = evaluateBrain( brain, trainingDrops);

  document.getElementById("trainingStatus").textContent = 
  "Current network caught " + result.catches + " of 20 apples.";
}
function startChallenge() {
  const wasGameOver = lives === 0;
  challengeDrops = null;
document.getElementById("challengeStatus").textContent =
  "Practice mode. Start a new challenge when ready.";

  challengeDrops = Array.from(
    { length: 20 },
    () => 10 + Math.random() * (canvas.width - 20)
  );

  challengeAIScore = evaluateBrain(brain, challengeDrops).catches;
  challengeIndex = 0;

  aiMode = false;
  moveLeft = false;
  moveRight = false;
  basketX = 160;
  score = 0;
  lives = 20;
  appleX = challengeDrops[0];
  appleY = -10;

  document.getElementById("modeButton").textContent = "Switch to AI";
  document.getElementById("challengeStatus").textContent =
    "Your turn! Catch as many of the 20 apples as possible.";

  if (wasGameOver) update();
}

function finishApple(caught) {
  if (caught) score += 1;

  if (challengeDrops !== null) {
    challengeIndex += 1;
    lives = challengeDrops.length - challengeIndex;

    if (lives === 0) {
      let winner = "Draw!";
      if (score > challengeAIScore) winner = "You win!";
      if (score < challengeAIScore) winner = "AI wins!";

      document.getElementById("challengeStatus").textContent =
        "You: " + score + "/20 | AI: " +
        challengeAIScore + "/20 | " + winner;

      return;
    }

    appleX = challengeDrops[challengeIndex];
  } else {
    if (!caught) lives -= 1;
    appleX = 10 + Math.random() * (canvas.width - 20);
  }

  appleY = -10;
}

function toggleMode() {
  const wasGameOver = lives === 0;

  aiMode = !aiMode;
  moveLeft = false;
  moveRight = false;

  basketX = 160;
  appleX=10+Math.random()*(canvas.width-20);
  appleY=-10;
  score=0;
  lives=3;

  document.getElementById("modeButton").textContent = aiMode ? "Switch to Human" : "Switch to AI";

  if (wasGameOver) {
    update();
  }
}
function update() {
  appleY = appleY + 2;
  let action = "stay";

  if (aiMode) {
    action = runBrain(brain, getInputs()).action;
  } else {
    if (moveLeft && !moveRight) action = "left";
    if (moveRight && !moveLeft) action = "right";
  }

  moveBasket(action);

  const caught =
    appleY + 10 >= 460 &&
    appleY - 10 <= 480 &&
    appleX + 10 >= basketX &&
    appleX - 10 <= basketX + 80;

  if (caught) {
    finishApple(true);
  } else if (appleY > canvas.height + 10) {
    finishApple(false);
  }

  draw();

  if (lives > 0) {
    requestAnimationFrame(update);
  }
}
update();
</script>
</body>
</html>
